name: Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    name: Windows standalone (PyInstaller)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -e .
      - name: Build exe
        run: >
          pyinstaller --onefile --name androbuilder
          --collect-all botocore --collect-all boto3
          --collect-all awscrt --collect-all s3transfer
          src/androbuilder/__main__.py
      - name: Zip
        run: Compress-Archive -Path dist/androbuilder.exe -DestinationPath androbuilder-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: androbuilder-windows-x64.zip

  deb:
    name: Debian package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          gem install fpm
          python -m pip install --upgrade pip build
      - name: Build wheel (so we don't race the PyPI publish)
        run: python -m build --wheel
      - name: Build .deb from the local wheel
        run: ./packaging/deb/build-deb.sh "${GITHUB_REF_NAME#v}" amd64 "$(ls dist/*.whl)"
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: "*.deb"

  attach:
    name: Attach to release
    needs: [windows, deb]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/*.zip
            artifacts/deb/*.deb
